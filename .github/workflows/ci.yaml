name: CI
run-name: running job for ${{vars.VERSION}}
on:
  pull_request:
    types: [opened]
    branches: master

jobs:
  Docker_build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Docker Setup
        uses: docker/setup-docker-action@v5.4.0
      - name: build docker image
        run: |
          docker build . -t java_app
      - name: run and test java_app
        run: docker run --rm java_app | grep -q "Hello World!" && echo "Success" || exit 1
      - name: save image to archive
        run: docker save java_app -o /tmp/java_app.tar
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: java-docker-image
          path: /tmp/java_app.tar
          retention-days: 1

  Change_Version:
    runs-on: ubuntu-latest
    needs: Docker_build_test
    permissions:
      contents: write
    outputs:
      new_version: ${{steps.bump.outputs.new_version}}
    steps:
      - name: checkout repo code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: increase patch VERSION
        id: bump
        run: |
          CURRENT_VERSION="${{vars.VERSION}}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - name: update gitlab variable
        run: |
          gh variable set VERSION --body "${{ steps.bump.outputs.new_version }}"
        env:
          GH_TOKEN: ${{  secrets.PAT_TOKEN  }}
      - name: Update version in pom.xml
        run: |
          mvn versions:set -DnewVersion="${{ steps.bump.outputs.new_version }}" -DgenerateBackupPoms=false
      - name: Commit version bump to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git diff --staged --quiet || git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
          git push
  Upload_to_dockerhub:
    runs-on: ubuntu-latest
    needs: Change_Version
    env:
      REGISTRY_IMAGE: "${{ vars.DOCKERHUB_USERNAME }}/java_app"
      NEW_VERSION: "${{ needs.Change_Version.outputs.new_version }}"
    steps:
      - name: download artifacrt
        uses: actions/download-artifact@v8.0.1
        with:
          name: java-docker-image
          path: /tmp
      - name: Docker Setup
        uses: docker/setup-docker-action@v5.4.0
      - name: untar image
        run: docker load -i /tmp/java_app.tar
      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}
      - name: tag and push image
        run: |
          docker tag java_app:latest $REGISTRY_IMAGE:$NEW_VERSION
          docker push $REGISTRY_IMAGE:$NEW_VERSION
          docker tag java_app:latest $REGISTRY_IMAGE:latest
          docker push $REGISTRY_IMAGE:latest
